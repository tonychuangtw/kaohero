<!doctype html>
<html lang="zh-Hant"><head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>考英雄 OG 圖（1200x630 截圖用）</title>
<style>
  html,body{margin:0;padding:0;background:#000}
  /* 截圖範圍就是這個 .og，尺寸固定 1200x630 */
  .og{width:1200px;height:630px;position:relative;overflow:hidden;
    background:radial-gradient(900px 420px at 50% -140px,#1b2432 0%,transparent 70%),#0e1218;
    color:#eef2f8;box-sizing:border-box;padding:0 90px;
    display:flex;flex-direction:column;justify-content:center;
    font-family:"Noto Serif TC","Source Han Serif TC","Songti TC","PMingLiU",serif}
  .row1{display:flex;align-items:center;gap:14px;margin-bottom:44px}
  .row1 svg{display:block;width:96px;height:96px;flex:0 0 96px}
  .name{font-size:78px;font-weight:900;letter-spacing:.06em;line-height:1}
  .l2{font-size:52px;font-weight:800;letter-spacing:.02em;line-height:1.45;margin:0}
  .l2 em{font-style:normal;color:#e3b25c}
  .l3{font-size:52px;font-weight:800;letter-spacing:.02em;line-height:1.45;margin:0 0 40px}
  .foot{font-size:30px;color:#a3b0c2;letter-spacing:.02em;display:flex;gap:34px;align-items:baseline}
  .foot .cats{color:#a3b0c2}
  .foot .dom{color:#eef2f8}
</style></head><body>
<div class="og">
  <div class="row1">
    <svg viewBox="0 0 40 40"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e3b25c"/><stop offset="1" stop-color="#8a6520"/></linearGradient></defs>
      <rect width="40" height="40" rx="11" fill="url(#g)"/>
      <path d="M11.5 20.5l5.5 5.5L28.5 14.5" fill="none" stroke="#1a1206" stroke-width="4.2"
        stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span class="name">考英雄</span>
  </div>
  <p class="l2">國考考古題 <em>免費線上練習</em></p>
  <p class="l3">109,281 題・逐題詳解附出處</p>
  <div class="foot">
    <span class="cats">高普考｜地方特考｜醫事人員｜教師檢定｜律師</span>
    <span class="dom">kaohero.com</span>
  </div>
</div>
</body></html>
